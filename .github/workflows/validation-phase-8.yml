
name: Validation phase 8 - Consolidation des tests

on:
  push:
    branches:
      - validation-phase-8
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-phase-8:
    name: Tests consolides Apple Silicon
    runs-on: macos-15
    timeout-minutes: 25

    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Verifier la plateforme
        shell: bash
        run: |
          set -euo pipefail
          python --version
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Installer les dependances de test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check

      - name: Preparer les rapports
        run: mkdir -p reports

      - name: Tests unitaires principaux
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s . \
            -p 'test_*.py' \
            -t . \
            -v 2>&1 | tee reports/phase8-unit.log

      - name: Phase 2 - Tests du moteur
        shell: bash
        run: |
          set -euo pipefail
          python ci/test_phase2.py \
            2>&1 | tee reports/phase8-phase2.log

      - name: Phase 3 - Tests du worker
        shell: bash
        run: |
          set -euo pipefail
          python ci/test_phase3.py \
            2>&1 | tee reports/phase8-phase3.log

      - name: Phase 4 - Publication sans ecrasement
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s ci \
            -p 'test_phase4.py' \
            -v 2>&1 | tee reports/phase8-phase4.log

      - name: Phase 5 - Verification des wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s ci \
            -p 'test_phase5.py' \
            -v 2>&1 | tee reports/phase8-phase5.log

      - name: Phase 7 - Refus SHA256 incorrect
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s ci \
            -p 'test_phase7.py' \
            -v 2>&1 | tee reports/phase8-phase7.log

      - name: Verifier les dependances finales
        run: python -m pip check

      - name: Archiver les preuves de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-validation-phase-8
          path: reports/
          if-no-files-found: warn
          retention-days: 14
