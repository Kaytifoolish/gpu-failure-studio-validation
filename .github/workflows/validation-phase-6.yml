

name: Validation phase 6 - Installation hors ligne

on:
  push:
    branches:
      - validation-phase-6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-installation:
    name: Diagnostic des dependances Apple Silicon
    runs-on: macos-15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verifier la plateforme
        run: |
          python --version
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Preparer un environnement temporaire
        run: |
          python -m venv "$RUNNER_TEMP/gpu-phase6"
          "$RUNNER_TEMP/gpu-phase6/bin/python" -m pip --version
          mkdir -p "$RUNNER_TEMP/gpu-phase6-wheels"

      - name: Telecharger les wheels et dependances transitives
        run: |
          "$RUNNER_TEMP/gpu-phase6/bin/python" -m pip download \
            --only-binary=:all: \
            --dest "$RUNNER_TEMP/gpu-phase6-wheels" \
            -r requirements.txt

      - name: Inventorier les wheels
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          folder = Path(os.environ["RUNNER_TEMP"]) / "gpu-phase6-wheels"
          wheels = sorted(folder.glob("*.whl"))

          print("Nombre de wheels :", len(wheels))
          for wheel in wheels:
              print(wheel.name)

          if not wheels:
              raise SystemExit("ECHEC : aucune wheel telechargee")
          PY

      - name: Tester une installation hors ligne isolee
        run: |
          python -m venv "$RUNNER_TEMP/gpu-phase6-install"
          "$RUNNER_TEMP/gpu-phase6-install/bin/python" -m pip install \
            --no-index \
            --only-binary=:all: \
            --find-links "$RUNNER_TEMP/gpu-phase6-wheels" \
            -r requirements.txt

          "$RUNNER_TEMP/gpu-phase6-install/bin/python" -m pip check

      - name: Verifier les imports principaux
        run: |
          "$RUNNER_TEMP/gpu-phase6-install/bin/python" - <<'PY'
          import numpy
          import PIL
          import rawpy
          import tifffile
          import psutil

          print("OK : cinq bibliotheques importees")
          PY

      - name: Signaler les limites du diagnostic
        run: |
          echo "Diagnostic technique termine."
          echo "Aucune wheel n'a ete approuvee independamment."
          echo "Le manifeste approved_wheels.json n'a pas ete cree."
          echo "Le script install.command n'a pas ete execute."
          echo "La securite globale de l'application n'est pas validee."
