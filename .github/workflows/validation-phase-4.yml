
name: Validation phase 4 Apple Silicon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Tests de non-ecrasement
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Verifier l'architecture
        run: |
          uname -m
          python -c "import platform; assert platform.machine() == 'arm64'"

      - name: Installer les dependances
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check

      - name: Executer les tests phase 4
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s ci -p 'test_phase4.py' -v
